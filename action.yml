name: PolkaMeter
description: Install PolkaMeter, run a plan and fail the job when the plan fails. Linux and macOS runners.
inputs:
  plan:
    description: Path to the .polkameter.xml plan, relative to the workspace.
    required: true
  plugins:
    description: Plugin executables to install, one per line, relative to the workspace.
    required: false
    default: ""
  plugin-crates:
    description: Plugin package directories or Cargo.toml paths to build and install, one path or path:package per line.
    required: false
    default: ""
  plugin-unlocked:
    description: Allow plugin-crates builds to update Cargo.lock. By default builds use --locked and require an up-to-date lockfile.
    required: false
    default: "false"
  install:
    description: 'CLI installation: auto (release with source fallback), release or source.'
    required: false
    default: auto
  version:
    description: Release version (X.Y.Z or vX.Y.Z, optionally with a prerelease such as -rc.1). Empty uses a full release tag or the package version for a moving major tag; other refs build from source.
    required: false
    default: ""
  verify-attestation:
    description: Require gh verification of the release workflow and source tag. False explicitly skips provenance with a warning; SHA-256 is always checked.
    required: false
    default: "true"
  credentials:
    description: Credential profiles to map to environment variables, one PROFILE=ENV_VAR per line. Set the secret variables on the calling step with env:; secrets are never inputs.
    required: false
    default: ""
  topologies:
    description: Zombienet topologies to register, one ALIAS=path per line.
    required: false
    default: ""
  capabilities:
    description: Capabilities the network provisioner supplies, one name per line.
    required: false
    default: ""
  output:
    description: Artifact root, relative to the workspace. The run creates one run-* directory inside it.
    required: false
    default: polkameter-runs
  fail-on:
    description: 'Failure policy: verdict-or-inconclusive (default; also fail on a FAIL or INCONCLUSIVE load verdict), verdict (also fail on FAIL) or error (only a failed run).'
    required: false
    default: verdict-or-inconclusive
  upload:
    description: Upload the run's reports as a workflow artifact. Skipped with a notice on GitHub Enterprise Server.
    required: false
    default: "true"
  upload-raw-plugin-files:
    description: Also upload files that plugins wrote into the run directory. PolkaMeter does not redact them.
    required: false
    default: "false"
  artifact-name:
    description: Name of the uploaded run artifact. Empty derives a name unique to the job, attempt and action step.
    required: false
    default: ""
  artifact-retention-days:
    description: Days to keep the run artifact, 1 to 90. Empty uses the repository setting.
    required: false
    default: ""
  artifact-size-limit-mb:
    description: Upload at most this many MiB of run records; larger records are omitted and listed. Reports are always kept. 0 means no limit.
    required: false
    default: "500"
  toolchain:
    description: Rust toolchain that builds PolkaMeter or plugin-crates. It must be 1.93 or newer.
    required: false
    default: 1.93.0
outputs:
  version:
    description: Installed CLI version, without the v prefix.
    value: ${{ steps.install.outputs.version }}
  install-method:
    description: CLI installation method (release or source).
    value: ${{ steps.install.outputs.install-method }}
  junit:
    description: Path to the run's junit.xml (from v0.3.0), or empty if it was not written.
    value: ${{ steps.run.outputs.junit }}
  run-dir:
    description: The run directory, relative to the workspace.
    value: ${{ steps.run.outputs.run-dir }}
  exit-code:
    description: 'The exit code of polkameter run. See "What fails the job" in docs/ci.md.'
    value: ${{ steps.run.outputs.exit-code }}
  verdict:
    description: Load verdict (PASS, WARN, FAIL or INCONCLUSIVE), or empty when no verdict was written.
    value: ${{ steps.run.outputs.verdict }}
  artifact-name:
    description: Name of the run artifact, or empty when nothing was staged.
    value: ${{ steps.stage.outputs.artifact-name }}
  artifact-path:
    description: Directory holding the staged artifact files, or empty when nothing was staged.
    value: ${{ steps.stage.outputs.artifact-path }}
  artifact-id:
    description: ID of the uploaded run artifact, or empty when it was not uploaded.
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Validate failure policy
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        case "$FAIL_ON" in
          error|verdict|verdict-or-inconclusive) ;;
          *) echo "::error::fail-on must be error, verdict or verdict-or-inconclusive"; exit 2 ;;
        esac
    - name: Validate artifact inputs
      shell: bash
      env:
        UPLOAD: ${{ inputs.upload }}
        RAW_PLUGIN_FILES: ${{ inputs.upload-raw-plugin-files }}
        SIZE_LIMIT_MB: ${{ inputs.artifact-size-limit-mb }}
        RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/action-stage-artifact.py" --check
    - name: Install released PolkaMeter or select source
      id: install
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        GITHUB_TOKEN: ${{ github.token }}
        VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        PLUGIN_CRATES: ${{ inputs.plugin-crates }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/action-install.py"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      if: steps.install.outputs.needs-toolchain == 'true'
      with:
        toolchain: ${{ inputs.toolchain }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: steps.install.outputs.install-method == 'source'
      with:
        # A target dir of its own, so restoring the cache never overwrites the
        # caller's target/ when the action runs from the same checkout (uses: ./).
        workspaces: ${{ github.action_path }} -> .polkameter-action-target
        key: polkameter-action
    - name: Build PolkaMeter
      if: steps.install.outputs.install-method == 'source'
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        cargo +"$TOOLCHAIN" build --locked --release -p polkameter --bin polkameter \
          --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml" --target-dir "$GITHUB_ACTION_PATH/.polkameter-action-target"
        echo "$GITHUB_ACTION_PATH/.polkameter-action-target/release" >> "$GITHUB_PATH"
    - name: Run the plan
      id: run
      shell: bash
      env:
        PLAN: ${{ inputs.plan }}
        PLUGINS: ${{ inputs.plugins }}
        PLUGIN_CRATES: ${{ inputs.plugin-crates }}
        TOOLCHAIN: ${{ inputs.toolchain }}
        PLUGIN_UNLOCKED: ${{ inputs.plugin-unlocked }}
        CREDENTIALS: ${{ inputs.credentials }}
        TOPOLOGIES: ${{ inputs.topologies }}
        CAPABILITIES: ${{ inputs.capabilities }}
        OUTPUT: ${{ inputs.output }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        run_args=("$PLAN" --output "$OUTPUT")
        fail_on_inconclusive=false
        case "$FAIL_ON" in
          verdict) run_args+=(--fail-on-verdict) ;;
          verdict-or-inconclusive)
            run_args+=(--fail-on-verdict)
            # The installed CLI is this action's own release or source build, which has the
            # flag (v0.2.0 release assets do not match the installer's names, so version: 0.2.0
            # builds this ref). Ask its help anyway, so a CLI without the flag warns instead of
            # failing every run on an unknown argument.
            run_help=$(polkameter run --help 2>&1 || true)
            case "$run_help" in
              *--fail-on-inconclusive*)
                run_args+=(--fail-on-inconclusive)
                fail_on_inconclusive=true
                ;;
              *)
                echo "::warning::This PolkaMeter CLI has no --fail-on-inconclusive (added in v0.3.0), so an INCONCLUSIVE verdict will not fail the job; a FAIL verdict still does. Install v0.3.0 or newer, or set fail-on: verdict to keep this behaviour without the warning."
                ;;
            esac
            ;;
        esac

        # Prints the non-blank lines of $1 with surrounding spaces removed.
        lines() { printf '%s\n' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d'; }
        export POLKAMETER_PLUGIN_REGISTRY="$RUNNER_TEMP/polkameter/plugins.json"
        echo "POLKAMETER_PLUGIN_REGISTRY=$POLKAMETER_PLUGIN_REGISTRY" >> "$GITHUB_ENV"

        if [ -n "${PLUGIN_CRATES//[[:space:]]/}" ]; then
          python3 "$GITHUB_ACTION_PATH/scripts/action-build-plugins.py"
        fi
        while IFS= read -r plugin; do
          polkameter plugin install "$plugin"
        done < <(lines "$PLUGINS")
        while IFS='=' read -r profile variable; do
          polkameter plugin credential "$profile" "${variable:?expected PROFILE=ENV_VAR}"
        done < <(lines "$CREDENTIALS")
        while IFS='=' read -r alias path; do
          polkameter plugin topology "$alias" "${path:?expected ALIAS=path}"
        done < <(lines "$TOPOLOGIES")
        while IFS= read -r capability; do
          polkameter plugin capability "$capability"
        done < <(lines "$CAPABILITIES")

        polkameter validate "$PLAN"

        mkdir -p "$OUTPUT"
        find "$OUTPUT" -mindepth 1 -maxdepth 1 -type d -name 'run-*' | sort > "$RUNNER_TEMP/runs-before.txt"
        code=0
        polkameter run "${run_args[@]}" || code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        run_dir=$(find "$OUTPUT" -mindepth 1 -maxdepth 1 -type d -name 'run-*' | sort | comm -13 "$RUNNER_TEMP/runs-before.txt" -)
        if [ "$(printf '%s\n' "$run_dir" | grep -c .)" -ne 1 ]; then
          echo "::error::Expected one new run directory in $OUTPUT"
          exit 1
        fi
        echo "run-dir=$run_dir" >> "$GITHUB_OUTPUT"

        junit=""
        if [ -f "$run_dir/junit.xml" ]; then
          junit="$run_dir/junit.xml"
        fi
        echo "junit=$junit" >> "$GITHUB_OUTPUT"

        verdict=""
        if [ -f "$run_dir/summary.json" ]; then
          if ! verdict=$(jq -r '.verdict.result // empty' "$run_dir/summary.json"); then
            echo "::warning::Could not read verdict from $run_dir/summary.json"
            verdict=""
          fi
        fi
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        finished=false
        if [ -f "$run_dir/summary.md" ]; then
          # PolkaMeter redacts summary.md as it writes it and again when the run finishes; a
          # run that did not finish may have written it without the final pass.
          if python3 "$GITHUB_ACTION_PATH/scripts/action-stage-artifact.py" --finished "$run_dir"; then
            finished=true
            cat "$run_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::The run did not finish normally, so its summary.md missed PolkaMeter's final redaction pass; it is left out of the job summary."
          fi
        fi

        # Say why the job fails when the report failed the run: smoke mode or the verdict. The CLI
        # records why in execution.json (exit_reason); it is redacted once the run finished.
        if [ "$code" -eq 1 ] && [ "$finished" = true ] \
          && [ "$(jq -r '.state // empty' "$run_dir/execution.json" 2>/dev/null)" = completed_with_failures ]; then
          reason=$( { jq -r '.exit_reason // empty' "$run_dir/execution.json" 2>/dev/null || true; } | tr '\r\n' '  ')
          reason=${reason% }
          # Smoke mode fails on monitor problems and required checks with no result whatever
          # fail-on is, as the CLI does: then the policy is not what to change.
          smoke_failed=$(jq -r 'if .mode == "smoke" and ((.problems // [] | length) > 0
              or any(.checks[]?; .status == "no result" and (.optional | not))) then "true" else "false" end' \
            "$run_dir/summary.json" 2>/dev/null || echo false)
          results="https://github.com/agustinustheo/polkameter/blob/main/docs/reading-results.md"
          if [ "$smoke_failed" = true ]; then
            reason=${reason% (the checks are in summary.md)}
            reason=${reason#smoke mode fails the run on * flags; fix this one: }
            reason=${reason#smoke mode fails the run on * flags; fix these: }
            reason=${reason:-a monitor problem or a required check with no result; see summary.md}
            echo "::error title=PolkaMeter smoke run failed::${reason//%/%25}. Smoke mode fails the job on this whatever fail-on is set to; changing fail-on does not help."
            {
              echo
              echo "### Why this job failed"
              echo
              echo "This smoke-mode run (\`mode=\"smoke\"\`) failed on: $reason."
              echo
              echo "Smoke mode fails the run on any monitor problem or required check with no result, whatever \`fail-on\` is set to, so \`fail-on: verdict\` or \`fail-on: error\` does not help. Fix the missing result or the monitor problem (see [what to do about INCONCLUSIVE]($results#what-to-do-about-inconclusive)), or run the plan in stress mode."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$verdict" = INCONCLUSIVE ] && [ "$fail_on_inconclusive" = true ]; then
            reason=${reason%%; exit 1 because of *}
            reason=${reason#verdict INCONCLUSIVE: }
            reason=${reason:-see the outcome checks in summary.md}
            echo "::error title=PolkaMeter verdict INCONCLUSIVE::${reason//%/%25}. fail-on: verdict-or-inconclusive (the default) fails the job on INCONCLUSIVE; set fail-on: verdict to fail only on FAIL."
            {
              echo
              echo "### Why this job failed"
              echo
              echo "The load verdict is **INCONCLUSIVE**: $reason. The run did not show whether the chain holds the load, and \`fail-on: verdict-or-inconclusive\` (the default) fails the job on that."
              echo
              echo "Fix what kept the run from a result (see [what to do about INCONCLUSIVE]($results#what-to-do-about-inconclusive)), or set \`fail-on: verdict\` on this step to fail only on \`FAIL\`."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$verdict" = FAIL ] && [ "$FAIL_ON" != error ]; then
            reason=${reason%%; exit 1 because of *}
            reason=${reason#verdict FAIL: }
            reason=${reason:-see the outcome checks in summary.md}
            echo "::error title=PolkaMeter verdict FAIL::${reason//%/%25}. fail-on: $FAIL_ON fails the job on FAIL; set fail-on: error to fail only when the run itself fails."
            {
              echo
              echo "### Why this job failed"
              echo
              echo "The load verdict is **FAIL**: $reason. FAIL means the chain broke a stress criterion under load: the load stopped on a failure, a failure mode was found, a step broke a measure, or a check failed. \`fail-on: $FAIL_ON\` fails the job on that."
              echo
              echo "See [did it pass?]($results#did-it-pass) for the rules. A ramp plan that pushes the chain until it breaks usually ends FAIL; to keep such a job green and read the verdict from the \`verdict\` output instead, set \`fail-on: error\` on this step."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
    - name: Stage the run artifact
      id: stage
      if: always() && inputs.upload == 'true' && steps.run.outputs.run-dir
      shell: bash
      env:
        RUN_DIR: ${{ steps.run.outputs.run-dir }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        UPLOAD: ${{ inputs.upload }}
        RAW_PLUGIN_FILES: ${{ inputs.upload-raw-plugin-files }}
        SIZE_LIMIT_MB: ${{ inputs.artifact-size-limit-mb }}
        RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/action-stage-artifact.py"
    - name: Upload the run
      id: upload
      if: always() && steps.stage.outputs.upload == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.stage.outputs.artifact-name }}
        path: ${{ steps.stage.outputs.artifact-path }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: error
    - name: Fail the job if the plan failed
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$EXIT_CODE"
