name: PolkaMeter
description: Install PolkaMeter, run a plan and fail the job when the plan fails. Linux and macOS runners.
inputs:
  plan:
    description: Path to the .polkameter.xml plan, relative to the workspace.
    required: true
  plugins:
    description: Plugin executables to install, one per line, relative to the workspace. A bare name, such as polkameter-substrate-plugin, is found on PATH.
    required: false
    default: ""
  version:
    description: CLI release to install, such as 0.4.7, or latest. Empty uses the action's release tag.
    required: false
    default: ""
  credentials:
    description: Credential profiles to map to environment variables, one PROFILE=ENV_VAR per line. Set the secret variables on the calling step with env:; secrets are never inputs.
    required: false
    default: ""
  output:
    description: Artifact root, relative to the workspace. The run creates one run-* directory inside it.
    required: false
    default: polkameter-runs
  fail-on:
    description: 'Failure policy, passed to polkameter run --fail-on: verdict-or-inconclusive (default; also fail on a FAIL or INCONCLUSIVE load verdict), verdict (also fail on FAIL) or error (only a failed run).'
    required: false
    default: verdict-or-inconclusive
  upload:
    description: Upload the run's reports and records as a workflow artifact. Files that plugins write are never uploaded. Set false on GitHub Enterprise Server.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded run artifact. Empty derives a name unique to the job, attempt and run.
    required: false
    default: ""
  artifact-retention-days:
    description: Days to keep the run artifact, 1 to 90. Empty uses the repository setting.
    required: false
    default: ""
outputs:
  version:
    description: Installed CLI version, without the v prefix.
    value: ${{ steps.install.outputs.version }}
  junit:
    description: Path to the run's junit.xml, or empty if it was not written.
    value: ${{ steps.run.outputs.junit }}
  run-dir:
    description: The run directory, relative to the workspace.
    value: ${{ steps.run.outputs.run-dir }}
  exit-code:
    description: 'The exit code of polkameter run. See "What fails the job" in docs/ci.md.'
    value: ${{ steps.run.outputs.exit-code }}
  verdict:
    description: Load verdict (PASS, WARN, FAIL or INCONCLUSIVE), or empty when no verdict was written.
    value: ${{ steps.run.outputs.verdict }}
  artifact-name:
    description: Name of the run artifact, or empty when it was not uploaded.
    value: ${{ steps.upload.outputs.artifact-id && steps.run.outputs.artifact-name || '' }}
  artifact-id:
    description: ID of the uploaded run artifact, or empty when it was not uploaded.
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Install PolkaMeter
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version || github.action_ref }}
        # install.sh verifies the build attestation with gh when gh is signed in to github.com.
        GH_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
        POLKAMETER_INSTALL_DIR: ${{ runner.temp }}/polkameter/bin
      run: |
        case "$VERSION" in
          # A moving major tag such as v0 installs the release this action package is.
          v[0-9]|v[0-9][0-9]) VERSION=$(grep -m 1 '^version = ' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d '"' -f 2) ;;
          latest|v[0-9]*.*.*|[0-9]*.*.*) ;;
          *) echo "::error::Use the action at a release tag, such as agustinustheo/polkameter@v0, or set version"; exit 1 ;;
        esac
        sh "$GITHUB_ACTION_PATH/install.sh" "$VERSION"
        echo "$POLKAMETER_INSTALL_DIR" >> "$GITHUB_PATH"
        installed=$("$POLKAMETER_INSTALL_DIR/polkameter" --version)
        echo "version=${installed##* }" >> "$GITHUB_OUTPUT"
    - name: Run the plan
      id: run
      shell: bash
      env:
        PLAN: ${{ inputs.plan }}
        PLUGINS: ${{ inputs.plugins }}
        CREDENTIALS: ${{ inputs.credentials }}
        OUTPUT: ${{ inputs.output }}
        FAIL_ON: ${{ inputs.fail-on }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        # Prints the non-blank lines of $1 with surrounding spaces removed.
        lines() { printf '%s\n' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d'; }
        # A registry the caller set keeps topologies registered in an earlier step.
        export POLKAMETER_PLUGIN_REGISTRY="${POLKAMETER_PLUGIN_REGISTRY:-$RUNNER_TEMP/polkameter/plugins.json}"
        echo "POLKAMETER_PLUGIN_REGISTRY=$POLKAMETER_PLUGIN_REGISTRY" >> "$GITHUB_ENV"
        while IFS= read -r plugin; do
          # A bare name such as polkameter-substrate-plugin is looked up on PATH.
          if [ ! -e "$plugin" ] && [[ "$plugin" != */* ]] && command -v "$plugin" > /dev/null; then
            plugin=$(command -v "$plugin")
          fi
          polkameter plugin install "$plugin"
        done < <(lines "$PLUGINS")
        while IFS='=' read -r profile variable; do
          polkameter plugin credential "$profile" "${variable:?expected PROFILE=ENV_VAR}"
        done < <(lines "$CREDENTIALS")

        polkameter validate "$PLAN"

        mkdir -p "$OUTPUT"
        find "$OUTPUT" -mindepth 1 -maxdepth 1 -type d -name 'run-*' | sort > "$RUNNER_TEMP/runs-before.txt"
        code=0
        polkameter run "$PLAN" --output "$OUTPUT" --fail-on "$FAIL_ON" || code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        run_dir=$(find "$OUTPUT" -mindepth 1 -maxdepth 1 -type d -name 'run-*' | sort | comm -13 "$RUNNER_TEMP/runs-before.txt" -)
        if [ "$(printf '%s\n' "$run_dir" | grep -c .)" -ne 1 ]; then
          echo "::error::Expected one new run directory in $OUTPUT"
          exit 1
        fi
        echo "run-dir=$run_dir" >> "$GITHUB_OUTPUT"

        junit=""
        if [ -f "$run_dir/junit.xml" ]; then
          junit="$run_dir/junit.xml"
        fi
        echo "junit=$junit" >> "$GITHUB_OUTPUT"

        verdict=""
        if [ -f "$run_dir/summary.json" ]; then
          if ! verdict=$(jq -r '.verdict.result // empty' "$run_dir/summary.json"); then
            echo "::warning::Could not read verdict from $run_dir/summary.json"
            verdict=""
          fi
        fi
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

        # Files PolkaMeter writes, redacted or free of credential values. Plugins also write into
        # the run directory; their files are not redacted and never uploaded.
        uploaded=(execution.json plan.json resolved-plan.json resolved-targets.json calibration.json
          junit.xml events.jsonl steps.jsonl lost.jsonl samples.jtl blocks.jsonl load.jsonl
          node.jsonl chain.jsonl transactions.jsonl scrapes.jsonl)
        # PolkaMeter's last event follows its final redaction pass. A run killed before then
        # (SIGKILL, out of memory, a panic) misses it, so these files are withheld.
        if [ "$(tail -n 1 "$run_dir/events.jsonl" 2> /dev/null | jq -r '.event' 2> /dev/null)" = completed ]; then
          uploaded+=(summary.md summary.json plugin-checks.json 'plugins/*/stderr.log')
          if [ -f "$run_dir/summary.md" ]; then
            cat "$run_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          reason=$(jq -r '.exit_reason // .error // empty' "$run_dir/execution.json" 2> /dev/null | tr '\r\n' '  ' || true)
          if [ "$code" -ne 0 ] && [ -n "$reason" ]; then
            echo "::error title=PolkaMeter exited $code::${reason//%/%25}"
          fi
        else
          echo "::notice::The run did not finish normally, so it missed PolkaMeter's final redaction pass. Its summaries and plugin logs are left out of the job summary and the artifact."
        fi

        echo "artifact-name=${ARTIFACT_NAME:-polkameter-run-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT-${run_dir##*/}}" >> "$GITHUB_OUTPUT"
        # upload-artifact follows symbolic links. PolkaMeter writes none, so a link is a plugin's.
        if [ -n "$(find "$run_dir" -type l)" ]; then
          echo "::warning::$run_dir holds symbolic links, so the run artifact is not uploaded."
        else
          {
            echo 'artifact-paths<<POLKAMETER_PATHS'
            for name in "${uploaded[@]}"; do
              printf '%s/%s\n' "$run_dir" "$name"
            done
            echo POLKAMETER_PATHS
          } >> "$GITHUB_OUTPUT"
        fi
    - name: Upload the run
      id: upload
      if: always() && inputs.upload == 'true' && steps.run.outputs.artifact-paths
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.run.outputs.artifact-name }}
        path: ${{ steps.run.outputs.artifact-paths }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: error
    - name: Fail the job if the plan failed
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$EXIT_CODE"
