[package]
name = "polkameter"
description = "Headless CLI for JMeter-style Polkadot SDK load tests: validate, preflight, run and report XML plans, and serve a remote agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["polkadot", "substrate", "load-testing", "stress-testing"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "polkameter"
path = "src/main.rs"

[dependencies]
polkameter-engine.workspace = true

anyhow.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
flate2 = "1"
