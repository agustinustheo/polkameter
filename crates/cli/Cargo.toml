[package]
name = "polkameter"
description = "Headless CLI for JMeter-style Polkadot SDK load tests: validate, preflight, run and report XML plans, and serve a remote agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["polkadot", "substrate", "load-testing", "stress-testing"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "polkameter"
path = "src/main.rs"

[dependencies]
polkameter-plugin-sdk = { workspace = true, features = ["chain", "observers"] }

aho-corasick = "1.1"
anyhow.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive"] }
csv.workspace = true
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex.workspace = true
parity-scale-codec.workspace = true
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
sp-crypto-hashing.workspace = true
subxt = "=0.51.1"
subxt-rpcs.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = "0.30"
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["fs", "signal"] }

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "time"] }

[dev-dependencies]
flate2 = "1"
tokio = { workspace = true, features = ["test-util"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/polkameter-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/polkameter-{ version }-{ target }.zip"
pkg-fmt = "zip"
