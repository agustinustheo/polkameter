[package]
name = "polkameter-plugin-sdk"
description = "The SDK for PolkaMeter plugins: the JSON-line protocol, plus optional chain access (`chain`) and run recording and checks (`observers`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["polkadot", "substrate", "plugin", "load-testing"]
categories = ["development-tools::testing", "api-bindings"]

[features]
default = []
# A Polkadot SDK node over RPC: typed reads, events and submission (`polkameter_plugin_sdk::chain`).
chain = [
	"dep:subxt",
	"dep:subxt-signer",
	"dep:scale-info",
	"dep:thiserror",
]
# Recording and judging a run: run files, metric registry, block walker and checks
# (`polkameter_plugin_sdk::observers`). Implies `chain`, since the walker reads a chain.
observers = ["chain", "dep:tokio-util"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
hex.workspace = true
sp-crypto-hashing.workspace = true

thiserror = { workspace = true, optional = true }
subxt = { version = "=0.51.1", optional = true }
subxt-signer = { version = "=0.51.1", default-features = false, features = ["sr25519", "std"], optional = true }
scale-info = { version = "2.11.6", default-features = false, features = ["std"], optional = true }
tokio-util = { workspace = true, optional = true }

[[test]]
name = "checks_data"
required-features = ["observers"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
