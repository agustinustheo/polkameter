[package]
name = "polkameter-engine"
description = "The shared engine: plan parsing, plugin registry, execution, measurement and plots for the CLI and desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["polkadot", "substrate", "load-testing"]
categories = ["development-tools::testing"]

[dependencies]
polkameter-plugin-sdk = { workspace = true, features = ["chain", "observers"] }
polkameter-monitors.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
hex.workspace = true
sp-crypto-hashing.workspace = true
csv.workspace = true
subxt-rpcs.workspace = true
thiserror.workspace = true
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
