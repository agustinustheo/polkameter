name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  RUST_VERSION: 1.93.0
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
          - name: macOS
            os: macos-14
            bundles: dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm tauri build --bundles ${{ matrix.bundles }}
      - run: cargo +${{ env.RUST_VERSION }} build --release -p polkameter --bin polkameter
      - uses: actions/upload-artifact@v7
        with:
          name: polkameter-${{ matrix.name }}
          path: |
            target/release/bundle/**
            target/release/polkameter
            target/release/polkameter.exe
          if-no-files-found: error

  crates-io:
    name: Publish crates to crates.io
    needs: bundle
    if: github.event_name == 'push'
    environment: crates-io
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          toolchain: ${{ env.RUST_VERSION }}
          apt-packages: ""
      - name: Check the tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "${{ github.ref_name }}" = "v$version"
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +${{ env.RUST_VERSION }} publish --workspace --exclude polkameter-desktop --exclude polkameter-example-plugin --locked

  publish:
    name: Publish GitHub release
    needs: bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Package platform release archives
        shell: bash
        run: |
          mkdir -p release-assets
          for artifact in release-artifacts/polkameter-*; do
            test -d "$artifact"
            case "$(basename "$artifact")" in
              polkameter-Linux) target=linux-x86_64 ;;
              polkameter-macOS) target=macos-aarch64 ;;
              polkameter-Windows) target=windows-x86_64 ;;
              *) echo "Unexpected release artifact: $artifact" >&2; exit 1 ;;
            esac
            tar -C "$artifact" -czf "release-assets/polkameter-${target}.tar.gz" .
          done
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/polkameter.spdx.json
      - name: Attest release bundles
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/**/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          gh release create "${{ env.RELEASE_TAG }}" \
            --verify-tag \
            --title "${{ env.RELEASE_TAG }}" \
            --generate-notes \
            "${assets[@]}"
