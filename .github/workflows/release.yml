name: Release

on:
  push:
    # Moving major tags (v0, v1, ...) must not start another release.
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to resume (also select this tag as the workflow ref), e.g. v0.3.0
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_VERSION: 1.93.0
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Release builds start from clean state: no Rust caches, which other workflow
# runs could have written.
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Require the release tag as the workflow ref for provenance
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo 'Dispatch with --ref <release-tag> and -f tag=<release-tag>; a branch dispatch cannot attest the tag source-ref.' >&2
            exit 1
          fi
      # Keep tooling and source checkouts separate. The tag-ref guard above
      # ensures both belong to the release tag, including recovery dispatches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Check the tag matches the workspace version
        id: version
        working-directory: release-source
        run: python3 ../scripts/publish-crates.py --tag "$RELEASE_TAG" --check-only
      - id: commit
        working-directory: release-source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cli-linux:
    name: CLI (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    # Both architectures link against Ubuntu 22.04's glibc 2.35.
    container: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - name: Install CLI build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential curl ca-certificates git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: release-source
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build CLI and substrate plugin
        working-directory: release-source
        run: cargo +${{ env.RUST_VERSION }} build --locked --release -p polkameter -p polkameter-substrate-plugin --bin polkameter --bin polkameter-substrate-plugin --target ${{ matrix.target }}
      - name: Check Linux compatibility and package
        working-directory: release-source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          binary="target/$TARGET/release/polkameter"
          plugin="target/$TARGET/release/polkameter-substrate-plugin"
          "$binary" --version
          for executable in "$binary" "$plugin"; do
            ldd "$executable"
            baseline=$(readelf --version-info "$executable" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
            test "$(printf '%s\n' GLIBC_2.35 "$baseline" | sort -V | tail -1)" = GLIBC_2.35
            echo "Maximum required glibc version of $executable: $baseline"
          done
          python3 ../scripts/package-cli.py "$VERSION" "$TARGET" "$binary" --plugin "$plugin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: release-source/release-assets/*
          if-no-files-found: error

  cli-macos:
    name: CLI (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # x86_64 is cross-compiled on the arm64 runner: GitHub is retiring its Intel macOS image.
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-15
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: release-source
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Build and package CLI
        working-directory: release-source
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          cargo +${{ env.RUST_VERSION }} build --locked --release -p polkameter -p polkameter-substrate-plugin --bin polkameter --bin polkameter-substrate-plugin --target "$TARGET"
          # The arm64 runner may lack Rosetta to run the x86_64 build.
          if [ "$TARGET" != x86_64-apple-darwin ]; then "target/$TARGET/release/polkameter" --version; fi
          python3 ../scripts/package-cli.py "$VERSION" "$TARGET" "target/$TARGET/release/polkameter" \
            --plugin "target/$TARGET/release/polkameter-substrate-plugin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: release-source/release-assets/*
          if-no-files-found: error

  crates-io:
    name: Publish crates to crates.io
    # crates.io versions are permanent, so publish only after every build and the
    # GitHub release succeeded. Prerelease tags skip crates.io.
    needs: [prepare, publish]
    if: ${{ !contains(needs.prepare.outputs.version, '-') }}
    environment: crates-io
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: release-source
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Obtain a Trusted Publishing token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crates that are missing
        working-directory: release-source
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 ../scripts/publish-crates.py --tag "$RELEASE_TAG"

  publish:
    name: Publish GitHub release
    needs: [prepare, cli-linux, cli-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      - name: Attest CLI archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      # A published release is never changed: users may have pinned its checksums.
      - name: Draft the release, upload the assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          prerelease=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then prerelease=(--prerelease --latest=false); fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "::error::Release $RELEASE_TAG is already published. To change it, release a patch version."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" --clobber release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false

  major-tag:
    name: Move major action tag after successful release
    concurrency:
      group: release-major-${{ needs.prepare.outputs.major }}
      cancel-in-progress: false
    needs: [prepare, publish, crates-io]
    if: ${{ !contains(needs.prepare.outputs.version, '-') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Update major tag without moving it backwards on a recovery run
        env:
          MAJOR: ${{ needs.prepare.outputs.major }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          remote=$(git ls-remote --tags origin "refs/tags/v$MAJOR")
          if [ -n "$remote" ]; then
            git fetch origin "refs/tags/v$MAJOR:refs/tags/v$MAJOR"
          fi
          if git rev-parse "v$MAJOR" >/dev/null 2>&1; then
            current=$(git show "v$MAJOR:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
            newest=$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -1)
            if [ "$newest" != "$VERSION" ]; then
              echo "Keeping v$MAJOR at newer version $current"
              exit 0
            fi
          fi
          git tag -f "v$MAJOR" HEAD
          git push origin "refs/tags/v$MAJOR" --force
