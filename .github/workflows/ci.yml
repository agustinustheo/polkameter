name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.93.0

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          apt-packages: libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxml2-utils shellcheck
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -color
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: cargo +${{ env.RUST_VERSION }} fmt --all -- --check
      - run: cargo +${{ env.RUST_VERSION }} test --workspace
      - run: cargo +${{ env.RUST_VERSION }} clippy --workspace --all-targets -- -D warnings
      # The workspace build unifies every SDK feature on (the CLI enables them all), so build
      # each feature set alone to catch an item gated on the wrong feature.
      - name: Plugin SDK per feature
        run: |
          cargo +${{ env.RUST_VERSION }} clippy -p polkameter-plugin-sdk --no-default-features --all-targets -- -D warnings
          cargo +${{ env.RUST_VERSION }} clippy -p polkameter-plugin-sdk --no-default-features --features chain --all-targets -- -D warnings
          cargo +${{ env.RUST_VERSION }} clippy -p polkameter-plugin-sdk --no-default-features --features observers --all-targets -- -D warnings
          cargo +${{ env.RUST_VERSION }} test -p polkameter-plugin-sdk --no-default-features
      - name: Plugin SDK docs without and with features
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +${{ env.RUST_VERSION }} doc -p polkameter-plugin-sdk --no-default-features --no-deps
          cargo +${{ env.RUST_VERSION }} doc -p polkameter-plugin-sdk --all-features --no-deps
      - name: Verify schema, example plans and documentation plans
        run: |
          cargo +${{ env.RUST_VERSION }} build -p polkameter --bin polkameter
          python3 tests/validate-plans.py
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
      - name: Distribution tests
        run: |
          shellcheck install.sh
          python3 tests/distribution.py
      - name: Action shell tests
        run: python3 tests/action-smoke.py
      - name: CLI smoke
        run: |
          cargo +${{ env.RUST_VERSION }} build -p polkameter --bin polkameter
          cargo +${{ env.RUST_VERSION }} build -p polkameter-example-plugin
          tests/cli-smoke.sh
      - name: Package the crates for crates.io
        run: cargo +${{ env.RUST_VERSION }} publish --workspace --exclude polkameter-desktop --exclude polkameter-example-plugin --exclude polkameter-substrate-plugin --dry-run --locked

  dev-chain:
    name: Substrate plugin on a dev chain
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POLKAMETER_PLUGIN_REGISTRY: ${{ github.workspace }}/target/plugins.json
      POLKAMETER_SUBSTRATE_SEED: //Alice
      # Not the default .polkameter/dev-chain: upload-artifact skips hidden directories.
      POLKAMETER_DEV_CHAIN_DIR: ${{ github.workspace }}/target/dev-chain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: dev-chain
      # dev-chain.sh pins the node and runtime with their SHA-256 sums; a new pin is a new key.
      - name: Cache the dev chain binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/dev-chain/bin
          key: dev-chain-${{ runner.os }}-${{ hashFiles('scripts/dev-chain.sh') }}
      - name: Build the CLI and the substrate plugin
        run: cargo +${{ env.RUST_VERSION }} build --locked -p polkameter -p polkameter-substrate-plugin --bin polkameter --bin polkameter-substrate-plugin
      - name: Start the dev chain
        run: scripts/dev-chain.sh start
      - name: Plugin tests against the dev chain
        env:
          POLKAMETER_DEV_CHAIN_WS: ws://127.0.0.1:9944
        run: cargo +${{ env.RUST_VERSION }} test --locked -p polkameter-substrate-plugin --test dev_chain -- --ignored
      - name: Run the CI example plans
        run: |
          target/debug/polkameter plugin install target/debug/polkameter-substrate-plugin
          target/debug/polkameter plugin credential substrate-dev POLKAMETER_SUBSTRATE_SEED
          target/debug/polkameter init --rpc ws://127.0.0.1:9944 --profile substrate-dev --output target/init.polkameter.xml
          target/debug/polkameter validate target/init.polkameter.xml
          for plan in substrate-remarks-ci substrate-transfers-ci; do
            target/debug/polkameter run "examples/$plan.polkameter.xml" --output target/dev-chain-runs --fail-on-verdict
          done
          cat target/dev-chain-runs/run-*/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Stop the dev chain
        if: always()
        run: scripts/dev-chain.sh stop
      - name: Upload the runs and the node log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-chain-runs
          path: |
            target/dev-chain-runs/
            target/dev-chain/node.log
          if-no-files-found: ignore

  desktop-build:
    name: Desktop build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm tauri build --debug --no-bundle

  action:
    name: Action (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +${{ env.RUST_VERSION }} build --locked --release -p polkameter-example-plugin
      # A local action has no release tag, so it installs the latest release with install.sh.
      - uses: ./
        id: plan
        with:
          version: latest
          plan: examples/plugin-workflow.polkameter.xml
          plugins: target/release/polkameter-example-plugin
          fail-on: verdict
      # A second use in the same matrix job must not collide on the artifact name.
      - uses: ./
        id: again
        with:
          version: latest
          plan: examples/plugin-workflow.polkameter.xml
          plugins: target/release/polkameter-example-plugin
          artifact-retention-days: "1"
      - name: Assert the example plan passed
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exit-code }}
          VERDICT: ${{ steps.plan.outputs.verdict }}
          VERSION: ${{ steps.plan.outputs.version }}
          ARTIFACT: ${{ steps.plan.outputs.artifact-name }}
          ARTIFACT_ID: ${{ steps.plan.outputs.artifact-id }}
          SECOND_ARTIFACT: ${{ steps.again.outputs.artifact-name }}
          SECOND_ARTIFACT_ID: ${{ steps.again.outputs.artifact-id }}
        run: |
          test "$EXIT_CODE" = 0
          test -z "$VERDICT"
          test -n "$VERSION"
          test -n "$ARTIFACT_ID" && test -n "$SECOND_ARTIFACT_ID"
          test "$ARTIFACT" != "$SECOND_ARTIFACT"

  distribution-macos:
    name: Distribution (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The binstall contract test reads cargo metadata; nothing is compiled.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Installer and action tests with macOS tools
        run: |
          python3 tests/distribution.py
          python3 tests/action-smoke.py

  container:
    name: Container image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only, so the Dockerfile is tested before a release builds and pushes it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: polkameter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image
        run: |
          docker run --rm polkameter:ci --version
          docker run --rm --entrypoint sh polkameter:ci -c 'polkameter plugin install /usr/local/bin/polkameter-substrate-plugin'
          test "$(docker run --rm --entrypoint id polkameter:ci -u)" = 10001
          docker image ls polkameter:ci --format 'Image size: {{.Size}}'
      # The plugin runs inside the image, so build it for Linux; Ubuntu 22.04's
      # glibc 2.35 is older than the image's 2.36.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the example plugin
        run: cargo +${{ env.RUST_VERSION }} build --locked --release -p polkameter-example-plugin
      - name: Stop a running plan with docker stop
        run: |
          mkdir -m 777 stop-test
          cp target/release/polkameter-example-plugin tests/fixtures/stop.polkameter.xml stop-test/
          image() {
            docker run -v "$PWD/stop-test:/work" -w /work -e HOME=/tmp \
              -e POLKAMETER_PLUGIN_REGISTRY=/work/plugins.json "$@"
          }
          image --rm polkameter:ci plugin install /work/polkameter-example-plugin
          image -d --name stop-test polkameter:ci run /work/stop.polkameter.xml --output /work/runs
          # Wait until the plan's long step is running.
          for _ in $(seq 60); do
            if compgen -G 'stop-test/runs/run-*/plugins/example/wait.pid' >/dev/null; then break; fi
            sleep 1
          done
          compgen -G 'stop-test/runs/run-*/plugins/example/wait.pid'
          start=$(date +%s)
          docker stop --timeout 45 stop-test
          elapsed=$(( $(date +%s) - start ))
          echo "docker stop took ${elapsed}s"
          docker logs stop-test
          test "$(docker inspect --format '{{.State.ExitCode}}' stop-test)" = 130
          test "$elapsed" -lt 30
          run=$(echo stop-test/runs/run-*)
          jq -e '.state == "stopped" and .exit_code == 130' "$run/execution.json"
          tail -n 1 "$run/events.jsonl" | jq -e '.event == "completed"'
          test -s "$run/junit.xml"
          test -s "$run/summary.md"
          docker rm stop-test
