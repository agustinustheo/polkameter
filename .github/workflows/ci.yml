name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.93.0

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxml2-utils
      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -shellcheck= -color
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: cargo +${{ env.RUST_VERSION }} fmt --all -- --check
      - run: cargo +${{ env.RUST_VERSION }} test --workspace
      - run: cargo +${{ env.RUST_VERSION }} clippy --workspace --all-targets -- -D warnings
      - name: Verify the example plans
        run: |
          for plan in examples/*.polkameter.xml; do
            xmllint --noout --schema schemas/polkameter-plan.xsd "$plan"
            cargo +${{ env.RUST_VERSION }} run -p polkameter --bin polkameter -- validate "$plan" --format json
          done
      - name: CLI smoke
        run: |
          cargo +${{ env.RUST_VERSION }} build -p polkameter --bin polkameter -p polkameter-example-plugin
          tests/cli-smoke.sh

  desktop-build:
    name: Desktop build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm tauri build --debug --no-bundle
