name: Setup
description: pnpm, Node 22, a Rust toolchain, Linux desktop libraries and a Rust cache. Run after actions/checkout.
inputs:
  toolchain:
    description: Rust toolchain to install and cache for. Empty for a job without Rust.
    required: false
    default: ""
  components:
    description: Rust components to install, comma separated.
    required: false
    default: ""
  apt-packages:
    description: Linux packages to install with apt-get. Skipped on other systems.
    required: false
    default: libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
    - uses: dtolnay/rust-toolchain@master
      if: inputs.toolchain != ''
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@v2
      if: inputs.toolchain != ''
    - name: Install Linux system packages
      if: runner.os == 'Linux' && inputs.apt-packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.apt-packages }}
      run: |
        sudo apt-get update
        sudo apt-get install -y $PACKAGES
