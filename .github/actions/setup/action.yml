name: Setup
description: pnpm, Node 22, a Rust toolchain, Linux desktop libraries and optional Rust and pnpm caches. Run after actions/checkout.
inputs:
  toolchain:
    description: Rust toolchain to install and cache for. Empty for a job without Rust.
    required: false
    default: ""
  components:
    description: Rust components to install, comma separated.
    required: false
    default: ""
  cache:
    description: Restore and save the Rust and pnpm caches. Release builds set false.
    required: false
    default: "true"
  apt-packages:
    description: Linux packages to install with apt-get. Skipped on other systems.
    required: false
    default: libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      if: inputs.toolchain != ''
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.toolchain != '' && inputs.cache == 'true'
    - name: Install Linux system packages
      if: runner.os == 'Linux' && inputs.apt-packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.apt-packages }}
      run: |
        sudo apt-get update
        sudo apt-get install -y $PACKAGES
